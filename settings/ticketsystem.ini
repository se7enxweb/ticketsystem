[TicketSettings]
# The node of a "ticketsystem" folder object, listed by the original view ticketsystem/tickets (0: none; the view
# then sends the reader to ticketsystem/list).
TicketNodeID=0
# The class identifiers of a ticket and of a post (a reply) below it. The original class names are kept.
TicketClass=ticket
PostClass=ticket_comment
AttachmentClass=ticket_attachment
# Where a new ticket is stored: "user" = below the main node of the opener's user object (never public: the
# Users section is not readable by visitors), "node" = below TicketNodeID.
Placement=user

[NumberSettings]
# Readable ticket numbers: %prefix, %year and %seq (the counter of the year, zero-padded to Digits).
# Prefix=7X gives 7X-2026-00042.
Prefix=TS
Digits=5
Format=%prefix-%year-%seq

[StatusSettings]
# The status set in use (a [StatusSet_<name>] block). 7x: Open, Waiting on customer, Waiting on staff, On hold,
# Resolved, Closed. original: the ticketsystem 1.x set (New ... Deferred) for installations that keep it.
StatusSet=7x
AvailableSets[]
AvailableSets[]=7x
AvailableSets[]=original
# A resolved ticket closes by itself after this many days without a new post (0 = never); the cronjob
# ticketsystem_autoclose does it.
AutoCloseDays=7

# A status set. Statuses[<identifier>]=<label> in order (the order is the order of the options of the class
# attribute "state"). Tone[<identifier>]=ok|warn|bad|info|muted (the color of its pill). The roles name the status
# a ticket gets when it is opened (Default), when the customer posts (CustomerReply), when staff post
# (StaffReply), when the customer marks it solved (Resolved), when it closes (Closed) and when a resolved ticket is
# opened again (Reopen). ClosedStatuses[] are the statuses in which nobody can post any more; DoneStatuses[] the ones that are not
# "open" in the lists.
[StatusSet_7x]
Statuses[]
Statuses[open]=Open
Statuses[waiting_customer]=Waiting on customer
Statuses[waiting_staff]=Waiting on staff
Statuses[on_hold]=On hold
Statuses[resolved]=Resolved
Statuses[closed]=Closed
Tone[]
Tone[open]=info
Tone[waiting_customer]=warn
Tone[waiting_staff]=info
Tone[on_hold]=muted
Tone[resolved]=ok
Tone[closed]=muted
Default=open
CustomerReply=waiting_staff
StaffReply=waiting_customer
Resolved=resolved
Closed=closed
Reopen=waiting_staff
DoneStatuses[]
DoneStatuses[]=resolved
DoneStatuses[]=closed
ClosedStatuses[]
ClosedStatuses[]=closed
# The statuses staff may set by hand
StaffChoices[]
StaffChoices[]=open
StaffChoices[]=waiting_customer
StaffChoices[]=waiting_staff
StaffChoices[]=on_hold
StaffChoices[]=resolved
StaffChoices[]=closed

[StatusSet_original]
Statuses[]
Statuses[new]=New
Statuses[open]=Open
Statuses[started]=Started
Statuses[reopened]=Reopened
Statuses[resolved]=Resolved
Statuses[verified]=Verified
Statuses[confirmed]=Confirmed
Statuses[closed]=Closed
Statuses[invalid]=Invalid
Statuses[deferred]=Deferred
Tone[]
Tone[new]=info
Tone[open]=info
Tone[started]=warn
Tone[reopened]=warn
Tone[resolved]=ok
Tone[verified]=ok
Tone[confirmed]=info
Tone[closed]=muted
Tone[invalid]=muted
Tone[deferred]=muted
Default=new
CustomerReply=open
StaffReply=started
Resolved=resolved
Closed=closed
Reopen=reopened
DoneStatuses[]
DoneStatuses[]=resolved
DoneStatuses[]=verified
DoneStatuses[]=closed
DoneStatuses[]=invalid
DoneStatuses[]=deferred
ClosedStatuses[]
ClosedStatuses[]=closed
ClosedStatuses[]=invalid
StaffChoices[]
StaffChoices[]=new
StaffChoices[]=open
StaffChoices[]=started
StaffChoices[]=reopened
StaffChoices[]=resolved
StaffChoices[]=verified
StaffChoices[]=confirmed
StaffChoices[]=closed
StaffChoices[]=invalid
StaffChoices[]=deferred

[CategorySettings]
# Categories[<identifier>]=<label>, in order. They become the options of the class attribute "category".
Categories[]
Categories[general]=General question
Categories[technical]=Technical problem
Categories[billing]=Billing
Categories[account]=Account and sign-in
Categories[other]=Something else
Default=general

[PrioritySettings]
Priorities[]
Priorities[low]=Low
Priorities[medium]=Medium
Priorities[high]=High
Priorities[urgent]=Urgent
Default=medium

[AccountSettings]
# Who shares a ticket: auto = the Katalyst customer of the user when Katalyst is installed, else the user alone;
# katalyst; owner (every ticket belongs to its opener only). The policy limitation Scope "Account" reads it.
Resolver=auto

[MailSettings]
# Every post (the opening post too, and the poster's own) is mailed to everyone who follows the ticket (an
# Exponential subscription on the ticket node) and to the poster: HTML and text with the full post.
# Sender: empty = site.ini [MailSettings] EmailSender, then AdminEmail.
Sender=
SenderName=
ReplyTo=
# The site address that links in mails start with (https://example.com); empty = site.ini [SiteSettings] SiteURL
SiteURL=
# The name shown in mails; empty = site.ini [SiteSettings] SiteName
Brand=
# Mails to these domains are never sent: they are written to CaptureDirectory (relative to the installation;
# empty = only logged). Throwaway test users use addresses like test@example.invalid.
CaptureDomains[]
CaptureDomains[]=invalid
CaptureDirectory=var/log/ticketsystem-mail
# Further addresses that get a copy of every post (empty by default; never the support mailbox itself when that
# mailbox opens tickets by mail)
StaffRecipients[]

[ChromeSettings]
# The frame around the customer views: auto = the Katalyst customer console for a user with a Katalyst customer,
# else the extension's own; katalyst; standard.
Chrome=auto

[AssignmentSettings]
# Who works on a ticket (doc/assignment.md). Staff claim a ticket (assign it to themselves) or assign it to another
# member of StaffGroup; the lists filter "assigned to me" and "unassigned".
# The user group whose members can be assigned (by name, below the Users root).
StaffGroup=Technical Support Group
# A reply by staff to an unassigned ticket assigns it to them (enabled/disabled).
ClaimOnReply=enabled
# Round-robin per queue: a new ticket of these categories is assigned at once to the member of StaffGroup with the
# fewest open tickets (the one assigned longest ago on a tie). AutoAssign[<category>]=enabled
AutoAssign[]

[SLASettings]
# SLA timers and escalation (doc/sla.md). Targets in calendar minutes from the opening; paused while the ticket has
# one of PausedStatuses (the due times move on by the pause). The cronjob part "ticketsystem" escalates a ticket at
# WarnPercent of a target (level 1) and when a target is missed (level 2), and mails the alert.
# Off by default until the release that completes it.
Enabled=disabled
DefaultLevel=standard
Levels[]
Levels[]=standard
PausedStatuses[]
PausedStatuses[]=waiting_customer
WarnPercent=80
# With Katalyst: the level of the customer's active SLA entitlement (the shortest first response wins); a level
# without its own [SLA_<level>] block takes its first response from the entitlement's text, the resolution from
# DefaultLevel.
KatalystEntitlements=enabled
# Escalation raises the priority one step (enabled/disabled).
RaisePriority=disabled
# Who gets the alerts: the assignee, and the members of [AssignmentSettings] StaffGroup when the ticket has no
# assignee (AlertStaffGroup=enabled), and these addresses.
AlertStaffGroup=enabled
AlertRecipients[]

# One SLA level: minutes per priority. FirstResponse = the first staff reply, Resolution = resolved.
[SLA_standard]
Label=Standard
FirstResponse[]
FirstResponse[low]=2880
FirstResponse[medium]=1440
FirstResponse[high]=480
FirstResponse[urgent]=120
Resolution[]
Resolution[low]=20160
Resolution[medium]=10080
Resolution[high]=2880
Resolution[urgent]=1440

[AttachmentSettings]
# Files of tickets, replies and notes (doc/attachments.md). Stored below StorageDirectory (absolute, or relative to
# the installation) under random names, never in the public storage, and served only by ticketsystem/file to users
# who may read the ticket. Put StorageDirectory outside the web root in production.
Enabled=enabled
StorageDirectory=var/ticketsystem/attachments
# Megabytes per file, files per post
MaxFileSize=25
MaxFiles=5
# The extensions accepted (lower case); the content must match its type (checked with fileinfo).
AllowedExtensions[]
AllowedExtensions[]=pdf
AllowedExtensions[]=png
AllowedExtensions[]=jpg
AllowedExtensions[]=jpeg
AllowedExtensions[]=gif
AllowedExtensions[]=webp
AllowedExtensions[]=txt
AllowedExtensions[]=log
AllowedExtensions[]=csv
AllowedExtensions[]=json
AllowedExtensions[]=xml
AllowedExtensions[]=zip
AllowedExtensions[]=gz
AllowedExtensions[]=docx
AllowedExtensions[]=xlsx
AllowedExtensions[]=pptx
AllowedExtensions[]=odt
AllowedExtensions[]=ods
AllowedExtensions[]=eml
# A virus scanner run on every file before it is stored: %file is the path. Exit code 0 = clean, anything else
# refuses the file. Empty = no scan (e.g. ScanCommand=clamdscan --no-summary --fdpass %file).
ScanCommand=
# Refuse every file when ScanCommand is empty (enabled/disabled)
RequireScan=disabled

[MailInSettings]
# Reply by e-mail (doc/mail.md): bin/php/mailin.php reads a mail (from a pipe or a Maildir) and adds it to its
# ticket as a post of the sender. The sender must be a user who may reply to the ticket, and the mail must carry the
# signed reference of a ticket mail sent to that user (RequireToken) or name the ticket in its subject.
Enabled=disabled
# The secret of the signed references. Empty: one derived from the installation (set your own).
TokenSecret=
# The Reply-To of the ticket mails, %token = the reference (e.g. support+%token@example.com). Empty: no Reply-To
# with a reference; the reference is still in the text of every mail.
ReplyAddress=
RequireToken=enabled
# A mail without a ticket reference from a user who may open tickets opens a new ticket.
OpenNewTickets=enabled
# Megabytes of one mail
MaxMessageSize=30
# Addresses never taken (our own sender, to stop loops)
IgnoreSenders[]

[CSATSettings]
# The satisfaction rating (doc/csat.md): the customer rates a resolved or closed ticket 1 to 5 with a comment; the
# mail of a resolving reply asks for it. Off by default until the release that completes it.
Enabled=disabled
AskInMail=enabled

[ImportSettings]
# The import of WHMCS tickets (doc/import.md, bin/php/import_whmcs.php). Imported tickets are closed history; no
# mail is sent. Shown in the administration when Enabled=enabled.
Enabled=disabled
# The staff user the replies of WHMCS administrators are posted as (content object id; 0 = the admin user 14)
StaffUserID=0
# How a WHMCS client is found: katalyst = the Katalyst customer linked to the WHMCS client id (katalyst_customer_ref),
# map = only the --client-map file. Never by e-mail address.
ClientResolver=katalyst

[ReportSettings]
# Reports (doc/reports.md): staff only (policy ticketsystem/report), within the reader's read scope.
# Days of the default report period (the last n days up to today)
DefaultDays=30
# The longest period one report may cover, in days
MaxDays=1100
# At most this many tickets are counted per part of a report (and exported to CSV); a longer period says so
MaxRows=20000

[SearchSettings]
# The search (doc/search.md): staff with ticketsystem/report search every ticket of their read scope, internal notes
# included. enabled = customers (ticketsystem/read) may search their own tickets too: their scope only, never notes.
Customers=disabled
# At most this many posts and notes are matched per search text
MaxTextMatches=2000

[CannedSettings]
# Canned replies and macros (doc/canned-replies.md). Macros=disabled keeps them plain texts: no status, priority or
# assignee changes when a reply is sent.
Macros=enabled
# The longest text of a canned reply, in characters
MaxLength=20000

[LimitSettings]
MaxSubjectLength=200
MaxBodyLength=50000
# New tickets one user may open per hour
MaxOpenPerHour=10
# Tickets on one page of the list
ListLimit=25
# Staff search results per page
SearchLimit=50
# Internal notes: characters
MaxNoteLength=20000

